name: Autotag Photos

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply generated metadata to Flickr
        type: boolean
        required: true
        default: true
      openai_model:
        description: OpenAI model or Azure deployment name
        required: true
        default: gpt-5-mini
      openai_prompt_cost:
        description: Cost per 1M prompt tokens
        required: true
        default: "0.25"
      openai_completion_cost:
        description: Cost per 1M completion tokens
        required: true
        default: "2.00"
      openai_vision_cost:
        description: Fixed cost per image
        required: true
        default: "0.0"
      openai_max_output_tokens:
        description: Maximum output tokens per image
        required: true
        default: "800"
      analysis_concurrency:
        description: Concurrent OpenAI analyses
        required: true
        default: "3"
      flickr_image_url:
        description: Flickr image URL extra
        required: true
        default: url_m
      flickr_privacy_filter:
        description: Flickr privacy filter (all or 1-5)
        required: true
        default: "1"
      flickr_photoset_id:
        description: Optional single photoset ID
        required: false
        default: ""
      tag_mode:
        description: Preserve existing tags or replace them
        type: choice
        required: true
        default: merge
        options:
          - merge
          - replace
      update_fields:
        description: Comma-separated fields (title,description,tags)
        required: true
        default: title,description,tags
      max_photos:
        description: Optional maximum number of new analyses
        required: false
        default: ""
      max_total_cost:
        description: Optional recorded OpenAI cost limit
        required: false
        default: ""
      resume:
        description: Reuse the most recent workflow checkpoint
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: flickr-autotagger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  flickr-autotagger:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps .

      - name: Verify package
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Restore prior checkpoint
        if: ${{ inputs.resume }}
        uses: actions/cache/restore@v5
        with:
          path: .autotagger-checkpoint.jsonl
          key: autotagger-checkpoint-${{ github.run_id }}
          restore-keys: |
            autotagger-checkpoint-

      - name: Run Flickr Autotagger
        env:
          APPLY_CHANGES: ${{ inputs.apply_changes }}
          RESUME: ${{ inputs.resume }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_PROVIDER: ${{ vars.OPENAI_PROVIDER || 'openai' }}
          OPENAI_INSTRUCTION_ROLE: ${{ vars.OPENAI_INSTRUCTION_ROLE || 'developer' }}
          OPENAI_TOKENS_PARAMETER: ${{ vars.OPENAI_TOKENS_PARAMETER || 'max_completion_tokens' }}
          OPENAI_JSON_MODE: ${{ vars.OPENAI_JSON_MODE || 'true' }}
          OPENAI_IMAGE_DETAIL: ${{ vars.OPENAI_IMAGE_DETAIL || 'low' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_API_SECRET: ${{ secrets.FLICKR_API_SECRET }}
          FLICKR_OAUTH_TOKEN: ${{ secrets.FLICKR_OAUTH_TOKEN }}
          OPENAI_MODEL: ${{ inputs.openai_model }}
          OPENAI_COST_PER_1M_PROMPT_TOKEN: ${{ inputs.openai_prompt_cost }}
          OPENAI_COST_PER_1M_COMPLETION_TOKEN: ${{ inputs.openai_completion_cost }}
          OPENAI_VISION_COST_PER_IMAGE: ${{ inputs.openai_vision_cost }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ inputs.openai_max_output_tokens }}
          ANALYSIS_CONCURRENCY: ${{ inputs.analysis_concurrency }}
          FLICKR_IMAGE_URL: ${{ inputs.flickr_image_url }}
          FLICKR_PRIVACY_FILTER: ${{ inputs.flickr_privacy_filter }}
          FLICKR_PHOTOSET_ID: ${{ inputs.flickr_photoset_id }}
          TAG_MODE: ${{ inputs.tag_mode }}
          UPDATE_FIELDS: ${{ inputs.update_fields }}
          MAX_PHOTOS: ${{ inputs.max_photos }}
          MAX_TOTAL_COST: ${{ inputs.max_total_cost }}
          MAX_KEYWORDS: ${{ vars.MAX_KEYWORDS || '10' }}
          MAX_TITLE_CHARS: ${{ vars.MAX_TITLE_CHARS || '120' }}
          MAX_DESCRIPTION_CHARS: ${{ vars.MAX_DESCRIPTION_CHARS || '1200' }}
          METADATA_LANGUAGE: ${{ vars.METADATA_LANGUAGE || 'English' }}
          DESCRIPTION_STYLE: ${{ vars.DESCRIPTION_STYLE || 'detailed, factual, and concise' }}
          DESCRIPTION_POLICY: ${{ vars.DESCRIPTION_POLICY || 'missing-or-placeholder' }}
          DESCRIPTIONS_TO_ANALYZE: ${{ vars.DESCRIPTIONS_TO_ANALYZE }}
          SKIP_PREFIX: ${{ vars.SKIP_PREFIX }}
          PHOTOSET_ALLOWLIST: ${{ vars.PHOTOSET_ALLOWLIST }}
          PHOTOSET_DENYLIST: ${{ vars.PHOTOSET_DENYLIST }}
          PROMPT_FILE: ${{ vars.PROMPT_FILE }}
        run: |
          arguments=()
          if [[ "$APPLY_CHANGES" == "true" ]]; then
            arguments+=(--apply)
          fi
          python flickr-autotagger.py "${arguments[@]}"

      - name: Save checkpoint
        if: ${{ always() && inputs.resume && hashFiles('.autotagger-checkpoint.jsonl') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .autotagger-checkpoint.jsonl
          key: autotagger-checkpoint-${{ github.run_id }}

      - name: Upload run report and checkpoint
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: autotagger-run-${{ github.run_id }}
          path: |
            updated_metadata.json
            .autotagger-checkpoint.jsonl
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
